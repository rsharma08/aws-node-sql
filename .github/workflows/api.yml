name: API CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check index.js
          node --check db.js
          node --check bootstrap/index.js

      - name: Test API responses
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const { handler } = require("./index");

          async function check() {
            for (const [method, rawPath, expected] of [
              ["GET", "/health", 200],
              ["GET", "/missing", 404],
              ["POST", "/health", 404]
            ]) {
              const result = await handler({
                rawPath,
                requestContext: { http: { method } }
              });

              assert.equal(result.statusCode, expected);

              if (rawPath === "/health" && method === "GET") {
                assert.equal(JSON.parse(result.body).status, "ok");
              }
            }
          }

          check().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify packaging
        run: |
          npm prune --omit=dev
          test -s certs/global-bundle.pem
          mkdir -p dist
          zip -qr dist/api.zip \
            index.js db.js package.json node_modules certs
          unzip -t dist/api.zip

  deploy:
    name: Deploy API
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AWS_DEPLOY_ENABLED == 'true'

    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Build deployment package
        run: |
          npm ci --omit=dev
          test -s certs/global-bundle.pem
          mkdir -p dist
          zip -qr dist/api.zip \
            index.js db.js package.json node_modules certs

      - name: Check deployment settings
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          FUNCTION_NAME: ${{ vars.API_FUNCTION_NAME }}
        run: |
          test -n "$ROLE_ARN" || {
            echo "Missing AWS_DEPLOY_ROLE_ARN"
            exit 1
          }
          test -n "$FUNCTION_NAME" || {
            echo "Missing API_FUNCTION_NAME"
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
          role-session-name: github-api-${{ github.run_id }}
          role-duration-seconds: 900

      - name: Update API code
        env:
          FUNCTION_NAME: ${{ vars.API_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://dist/api.zip \
            --query LastModified \
            --output text

          aws lambda wait function-updated-v2 \
            --function-name "$FUNCTION_NAME"