version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm ci || npm install
  build:
    commands:
      - echo Running validation tests...
      - npm test --if-present
      - echo Packaging Lambda runtime code...
      - zip -r deployment_package.zip . -x "*.git*" "infra/*" "*.tf" "*.tfstate*" "deployment_package.zip"
  post_build:
    commands:
      - echo Deploying updated package to target AWS Lambda...
      - aws lambda update-function-code --function-name "$LAMBDA_FUNCTION_NAME" --zip-file fileb://deployment_package.zip
artifacts:
  files:
    - deployment_package.zip
